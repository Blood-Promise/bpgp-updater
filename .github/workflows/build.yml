name: Build

# Builds BPGPUpdater.exe and runs the tests on every pull request and push to main, so a broken build
# shows up before a release tag. The exe (and a test MSIX, to check the Store package builds) is kept as a
# downloadable artifact for 14 days, so a PR's version can be tried without building it locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run the tests
        shell: pwsh
        run: dotnet test Tests/BPGPUpdater.Tests.csproj -c Release

      - name: Build BPGPUpdater.exe
        shell: pwsh
        run: dotnet publish BPGPUpdater.csproj -c Release -o out

      - name: Build the Microsoft Store package
        shell: pwsh
        run: ./Package/build-msix.ps1 -Exe out -Version 0.0.1 -Output out/BPGPUpdater-test.msix

      - uses: actions/upload-artifact@v4
        with:
          name: BPGPUpdater
          path: |
            out/BPGPUpdater.exe
            out/BPGPUpdater-test.msix
          retention-days: 14
