name: Build

# Builds BPGPUpdater.exe on every pull request and push to main, so a broken build shows up before
# a release tag. The exe is kept as a downloadable artifact for 14 days, so a PR's version can be
# tried without building it locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BPGPUpdater.exe
        shell: pwsh
        run: dotnet publish BPGPUpdater.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: BPGPUpdater
          path: out/BPGPUpdater.exe
          retention-days: 14
