name: Release

# Pushing a tag like v1.0.0 builds BPGPUpdater.exe with that version and publishes it as a
# GitHub Release. Installed updaters update themselves from the newest release here.
# Tags with "alpha" or "beta" become a pre-release, which the self-update skips.
# The release also gets BPGPUpdater-<version>.msix, the Microsoft Store package (Package/).
# For normal (non-alpha/beta) tags that package is then submitted to the Microsoft Store
# (product 9NXVNH273470) with the Partner Center secrets; Microsoft certifies it before it goes live.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BPGPUpdater.exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish BPGPUpdater.csproj -c Release -o out "-p:Version=$version"

      - name: Build the Microsoft Store package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./Package/build-msix.ps1 -Exe out -Version $version -Output "out/BPGPUpdater-$version.msix"

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $notes = "BPGP Updater $version. Download BPGPUpdater.exe and run it: it installs and updates the BPGP addon. Already have it? It updates itself.`n`nWindows may say 'Windows protected your PC' because the exe isn't signed: click More info, then Run anyway."
          $flags = @()
          if ($version -match 'alpha|beta') { $flags += '--prerelease' }
          gh release create $tag out/BPGPUpdater.exe "out/BPGPUpdater-$version.msix" --repo '${{ github.repository }}' --title "BPGP Updater $version" --notes $notes @flags

      # Microsoft Store: only real releases, not alpha/beta
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}

      - name: Submit to the Microsoft Store
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId '${{ secrets.AZURE_AD_TENANT_ID }}' `
            --sellerId '${{ secrets.SELLER_ID }}' `
            --clientId '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}' `
            --clientSecret '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'
          $version = '${{ github.ref_name }}'.TrimStart('v')
          msstore publish "out/BPGPUpdater-$version.msix" -id 9NXVNH273470
